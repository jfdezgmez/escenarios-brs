services:
  biometria-web:
    build: .
    container_name: biometria_container
    ports:
      - "5000:5000"
    volumes:
      # Mantiene las plantillas biométricas registradas aunque el contenedor se reinicie
      - ./data:/app/data
    environment:
      # Umbrales del laboratorio, ajustables para experimentar en clase
      - EAR_UMBRAL=0.21
      - UMBRAL_DISTANCIA=0.50
      - PARPADEOS_REQUERIDOS=2
    restart: unless-stopped
